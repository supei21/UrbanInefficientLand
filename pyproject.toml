[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".conda", "frontend", "runtime", "outputs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -p no:langsmith"

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
exclude = "(^frontend/|^runtime/|^outputs/)"

[[tool.mypy.overrides]]
module = ["geopandas.*", "shapefile.*", "dbfread.*", "sklearn.*", "xgboost.*"]
ignore_missing_imports = true
